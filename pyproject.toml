[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "holography-ieee-research"
version = "0.1.0"
description = "Reproducible Fourier optics and volumetric CGH research"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]
deep = ["torch>=2.2"]
mri = ["scipy>=1.10", "nibabel>=5", "matplotlib>=3.7", "torch>=2.2"]

[tool.setuptools.packages.find]
where = ["src"]
